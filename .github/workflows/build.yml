name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies & CocoaPods
        run: |
          npm install
          sudo gem install cocoapods

      - name: Clean, Regenerate iOS and Fix Podfile Target
        run: |
          rm -rf ios
          npx cap add ios
          
	# Actualizar el deployment target a 15.0 usando Node.js de forma segura
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('ios/App/Podfile', 'utf8');
            content = content.replace(/platform :ios, .*/, \"platform :ios, '15.0'\");
            fs.writeFileSync('ios/App/Podfile', content);
          "          
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          cd ios/App/build/App.xcarchive/Products/Applications
          mkdir Payload
          mv App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-app-ipa
          path: ios/App/build/App.xcarchive/Products/Applications/App.ipa
