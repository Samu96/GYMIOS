<style>

.bub{max-width:85%;padding:10px 14px;border-radius:18px;margin:8px 0;font-size:15px}.bub.u{background:var(--acc);color:var(--accfg);margin-left:auto;border-bottom-right-radius:6px}.bub.a{background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.cbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -6px 24px rgba(15,23,42,.07);z-index:15}
.mic,.snd{width:46px;height:46px;border-radius:50%;border:0;flex:none;display:grid;place-items:center}.mic{background:var(--soft);color:var(--ink)}.mic.on{background:var(--ai);color:var(--aifg)}.snd{background:var(--acc);color:var(--accfg)}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body>

<nav id="nav"><button data-t="home" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button><button data-t="hist" aria-label="Historial"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button><button data-t="chat" class="navmic" aria-label="Hablar con el asistente"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button data-t="maq" aria-label="Ejercicios"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Ejercicios</button><button data-t="set" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Ajustes</button></nav>
<script>
const CAT=[
["pp","Press de pecho","empuje","pecho",30,5],["pi","Press inclinado","empuje","pecho",25,5],["pd","Pec deck (aperturas)","empuje","pecho",25,5],
["ph","Press de hombro","empuje","hombro",20,5],["el","Elevaciones laterales","empuje","hombro",10,2.5],["tp","Tríceps en polea","empuje","tríceps",20,2.5],["tm","Fondos / tríceps máquina","empuje","tríceps",25,5],
["jp","Jalón al pecho","tirón","espalda",35,5],["rs","Remo sentado","tirón","espalda",35,5],["rp","Remo en polea baja","tirón","espalda",35,5],
["cb","Curl de bíceps","tirón","bíceps",15,2.5],["pj","Pájaros (deltoide posterior)","tirón","hombro",20,5],["fp","Face pull","tirón","hombro",15,2.5],
["pr","Prensa de piernas","pierna","cuádriceps",80,10],["ec","Extensión de cuádriceps","pierna","cuádriceps",30,5],["cf","Curl femoral","pierna","femoral",25,5],
["ab","Abductores","pierna","glúteo",30,5],["ad","Aductores","pierna","aductor",30,5],["ht","Hip thrust","pierna","glúteo",40,10],["ge","Gemelos","pierna","gemelo",40,5],["cr","Abdominales máquina","pierna","core",20,5]
].map(a=>({id:a[0],name:a[1],t:a[2],m:a[3],w0:a[4],inc:a[5]}));
const TYPES=["empuje","tirón","pierna"];
let S,P={};
try{S=JSON.parse(localStorage.getItem("gym1"))}catch(e){}
try{localStorage.removeItem("gym1p")}catch(e){}
S=S||{};S.off=S.off||{};S.custom=S.custom||[];S.info=S.info||{};S.cw=S.cw||{};S.keys=S.keys||{};if(S.key){S.keys.claude=S.key;delete S.key}S.sessions=S.sessions||[];
if(S.cur&&!S.cur.phase)S.cur=null;
let ty="auto",tab="home",mins=60,note="",busy=false,msg="";
const save=()=>{try{localStorage.setItem("gym1",JSON.stringify(S))}catch(e){}};
const saveP=()=>{try{localStorage.setItem("gym1p",JSON.stringify(P))}catch(e){msg="No hay espacio para más fotos"}};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const ls=()=>CAT.concat(S.custom).map(x=>Object.assign({},x,S.info[x.id]||{}));
const all=()=>ls().filter(x=>!S.off[x.id]);
const byId=id=>ls().find(x=>x.id==id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(+n).toLocaleString("es-ES",{maximumFractionDigits:2});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function last(id){for(let i=S.sessions.length-1;i>=0;i--){const it=S.sessions[i].items.find(x=>x.id==id&&(x.st==null||x.st=="done"));if(it)return{w:it.w,r:it.r,i}}return null}
const cAge=m=>{for(let i=S.sessions.length-1;i>=0;i--){const q=S.sessions[i];if(q.kind=="class"&&(q.muscles||[]).includes(m))return S.sessions.length-i}return 99};
const age=id=>{const l=last(id),ex=byId(id);return Math.min(l?S.sessions.length-l.i:99,ex?cAge(ex.m):99)};
function rec(ex){const l=last(ex.id),c=S.cw[ex.id];if(c!=null&&(!l||l.w!=c))return{w:c,r:10};if(!l)return{w:ex.w0,r:10};
 if(l.r>=12)return{w:l.w+ex.inc*(l.r>=15?2:1),r:8};
 if(l.r<6)return{w:Math.max(0,l.w-ex.inc),r:8};
 return{w:l.w,r:Math.min(12,l.r+1)}}
function nextType(){const s=[...S.sessions].reverse().find(x=>TYPES.includes(x.type));return s?TYPES[(TYPES.indexOf(s.type)+1)%3]:"empuje"}
const mk=(ex,o)=>{const r=rec(ex);o=o||{};const w=isFinite(o.w)&&o.w>=0?o.w:r.w,rp=o.r>0&&o.r<=30?Math.round(o.r):r.r;
 const it={id:ex.id,w,r:rp,s:[2,3,4].includes(o.s)?o.s:3,pw:w,pr:rp,sk:[],st:"pend"};it.sets=Array.from({length:it.s},()=>({w:it.w,r:it.r,d:false}));return it};
function localPlan(type,n){const pool=all().filter(x=>type=="mixto"||x.t==type),rq=pool.filter(hit),rest=shuf(pool.filter(x=>!hit(x))).sort((a,b)=>age(b.id)-age(a.id)),cnt={},pick=[...rq];
 pick.forEach(x=>cnt[x.m]=(cnt[x.m]||0)+1);
 for(const x of rest){if(pick.length>=Math.max(n,rq.length))break;if((cnt[x.m]||0)>=2)continue;cnt[x.m]=(cnt[x.m]||0)+1;pick.push(x)}
 return pick.map(x=>mk(x))}
function pk(){if(ty!="auto")return[ty,"tu elección"];
 const ts=[...new Set(all().filter(hit).map(x=>x.t))];if(ts.length>1)return["mixto","tu nota"];if(ts.length==1)return[ts[0],"tu nota"];
 const t=norm(note),K={pierna:/pierna|femoral|gluteo|gemelo|pantorrilla|sentadilla|abdomin/g,empuje:/empuje|pecho|hombro/g,"tirón":/tiron|espalda|dorsal|jalon/g};let b=null,m=0;for(const k in K){const c=(t.match(K[k])||[]).length;if(c>m){m=c;b=k}}
 return b?[b,"tu nota"]:[nextType(),"te toca por rotación"]}
function pickType(){return pk()[0]}
function pvt(){const[t,w]=pk();return `Se preparará: ${cap(t)} · ${w}`}
function pvu(){const e=document.getElementById("pv");if(e)e.textContent=pvt()}
async function plan(){
 busy=true;msg="";render();
 const type=pickType(),n=Math.max(3,Math.min(8,Math.floor(mins/9)));let items=null,why="",er="";
 try{
  const ms=all().filter(x=>type=="mixto"||x.t==type).map(x=>({id:x.id,nombre:x.name,tipo:x.t,musculo:x.m,paso:x.inc,propuesta:rec(x),dias_desde_ultimo:age(x.id)==99?null:age(x.id),pedido:hit(x)}));
  const hs=S.sessions.slice(-4).map(s=>({tipo:s.type,fecha:s.date.slice(0,10),clase:s.kind=="class"?s.text:undefined,musculos:s.muscles,ejercicios:dn(s).map(i=>`${byId(i.id)?.name||i.id} ${i.w}kg x${i.r}`)}));
  const t=await ai(`Eres entrenador personal. Crea el entreno de hoy (${type=="mixto"?"mixto: combina los tipos que haga falta":type}) para un gimnasio de máquinas. Tiempo disponible: ${mins} min (aprox. 9 min por ejercicio, elige ${n}). Nota del usuario: "${note||"ninguna"}".
Ejercicios disponibles: ${JSON.stringify(ms)}
Últimos entrenos: ${JSON.stringify(hs)}
Reglas: las clases recientes cuentan como entreno (evita cargar de nuevo sus músculos); OBLIGATORIO incluir todos los ejercicios con pedido:true; la nota del usuario manda; usa solo ids de la lista; máx. 2 ejercicios por músculo; completa el resto priorizando los que llevan más tiempo sin hacerse; parte de la "propuesta" (peso y reps) y ajústala solo si la nota lo justifica; series 2-4; el peso debe ser múltiplo del paso.
Responde SOLO JSON: {"nota":"frase corta explicando el enfoque","ejercicios":[{"id":"..","series":3,"reps":10,"peso":40}]}`,{tier:"quick",max:1500});
  const r=pj(t),ok=(r.ejercicios||[]).filter(e=>ms.some(m=>m.id==e.id)).filter((e,i,a)=>a.findIndex(z=>z.id==e.id)==i);
  if(ok.length>=2){const rq=ms.filter(m=>m.pedido).map(m=>m.id);rq.forEach(id=>{if(!ok.some(e=>e.id==id))ok.unshift({id})});
   items=ok.slice(0,Math.max(n,rq.length)).map(e=>mk(byId(e.id),{w:+e.peso,r:+e.reps,s:+e.series}));why=String(r.nota||"").slice(0,200)}
 }catch(e){er=e&&e.message}
 if(!items){items=localPlan(type,n);why="Propuesta automática según tu historial"+(er=="noai"?" (sin IA: configura tu clave en Ajustes)":" (sin IA)")+"."}
 busy=false;tab="home";S.cur={phase:"plan",type,mins,why,date:new Date().toISOString(),sel:null,items};save();render()}
const dn=s=>s.items.filter(x=>x.st==null||x.st=="done");let hi=null;
const thumb=ex=>`<div class="th">${I[ex.id]?`<img alt="" src="${I[ex.id]}">`:D[ex.id]?`<img alt="" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(D[ex.id])}">`:bm(ex.m)}</div>`;

function hadj(j,k,d){const x=S.sessions[hi].items[j];x[k]=Math.max(0,Math.round((x[k]+d)*100)/100);sync([x.id]);save();render()}
function htog(j){const x=S.sessions[hi].items[j];x.st=x.st==null||x.st=="done"?"skip":"done";sync([x.id]);save();render()}
function sess(){const s=S.sessions[hi];if(!s){hi=null;return hist()}if(s.kind=="class")return clsDetail(s);
 return `<div class="sp"><button onclick="hi=null;render()">‹ Historial</button></div><h1 style="margin-top:8px">${cap(s.type)}</h1><p class="m">${new Date(s.date).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}. Corrige pesos, repeticiones o si lo hiciste.</p>
 ${s.items.map((x,j)=>{const ex=byId(x.id)||{name:x.id,inc:5},d=x.st==null||x.st=="done";return `<div class="card" style="${d?"":"opacity:.7"}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:18px">${esc(ex.name)}</b><button class="chk ${d?"on":""}" style="margin:0" aria-label="${d?"Hecho: marcar como no hecho":"No hecho: marcar como hecho"}" onclick="htog(${j})">✓</button></div>
 <div class="mini"><button aria-label="Menos peso" onclick="hadj(${j},'w',-${ex.inc})">−</button><span class="v">${fmt(x.w)} kg</span><button aria-label="Más peso" onclick="hadj(${j},'w',${ex.inc})">+</button><span style="flex:1"></span><button aria-label="Menos reps" onclick="hadj(${j},'r',-1)">−</button><span class="v">${x.r} reps</span><button aria-label="Más reps" onclick="hadj(${j},'r',1)">+</button></div></div>`}).join("")}${cdel?`<p class="m" style="margin:16px 0 0">¿Seguro? Se borrará este entreno del historial.</p><button class="btn" onclick="delS()">Sí, eliminar</button><button class="btn t" onclick="cdel=0;render()">Cancelar</button>`:`<button class="btn t" onclick="cdel=1;render()">Eliminar entreno</button>`}`}
function maq(){let h=`<h1>Mis ejercicios</h1><p class="m">Desmarca los que no tengas y ajusta el peso actual cuando mejores. Las fotos que analiza Claude no se guardan.</p>${msg?`<p class="m"><b>${esc(msg)}</b></p>`:""}
 <label class="btn">Añadir ejercicio con foto<input type="file" accept="image/*" capture="environment" hidden onchange="analyze(this,null)"></label>`;
 ls().forEach(x=>{const w=S.cw[x.id]??last(x.id)?.w??x.w0;
  h+=`<div class="card"><div class="tog"><div><b>${esc(x.name)}</b><div class="m">${cap(x.t)} · ${x.m}${x.note?" · "+esc(x.note):""}</div></div><input type="checkbox" aria-label="Tengo este ejercicio" ${S.off[x.id]?"":"checked"} onchange="tog('${x.id}',this.checked)"></div>
  <div class="mini"><span class="m" style="flex:1">Peso actual</span><button aria-label="Menos peso" onclick="setW('${x.id}',-${x.inc})">−</button><span class="v">${fmt(w)} kg</span><button aria-label="Más peso" onclick="setW('${x.id}',${x.inc})">+</button></div>
  <div style="display:flex;gap:16px;align-items:center"><label class="up">Analizar con foto<input type="file" accept="image/*" capture="environment" hidden onchange="analyze(this,'${x.id}')"></label><label class="up">${I[x.id]?"Cambiar imagen":"Subir imagen"}<input type="file" accept="image/*" hidden onchange="imgUp('${x.id}',this)"></label>${I[x.id]?`<button class="up" style="border:0;background:none;padding:8px 0 0;font:inherit;color:var(--mute)" onclick="delI('${x.id}')">Quitar</button>`:""}</div></div>`});
 return h+`<h2>Añadir sin foto</h2><input type="text" id="cn" placeholder="Nombre"><div class="chips" id="cc">${TYPES.map((t,i)=>`<button class="chip ${i==0?"on":""}" onclick="ct='${t}';document.querySelectorAll('#cc .chip').forEach(b=>b.classList.toggle('on',b==this))">${cap(t)}</button>`).join("")}</div><input type="text" id="cw" placeholder="Músculo (opcional)"><button class="btn g" onclick="addM()">Añadir</button>`}
let ct="empuje";
function tog(id,v){if(v)delete S.off[id];else S.off[id]=1;save()}
function addM(){const n=document.getElementById("cn").value.trim();if(!n)return;S.custom.push({id:"c"+Date.now(),name:n,t:ct,m:document.getElementById("cw").value.trim()||"otro",w0:20,inc:5});save();render()}
const shrink=f=>new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,768/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.8)};im.src=fr.result};fr.readAsDataURL(f)});
async function analyze(el,id){const f=el.files[0];if(!f)return;msg="Analizando la foto…";render();
 try{
    const known=ls().map(x=>({id:x.id,nombre:x.name}));
  const r=pj(await ai(`Analiza la foto de una máquina de gimnasio. ${id?`Es la máquina "${byId(id).name}".`:`Compárala con esta lista: ${JSON.stringify(known)}.`}
Responde SOLO JSON: {"id":"id de la lista si es la misma máquina, o null","nombre":"nombre en español","tipo":"empuje|tirón|pierna","musculo":"músculo principal","paso":salto entre pesas en kg (normalmente 2.5, 5 o 10) según el selector o las placas que se vean,"peso_inicial":peso prudente en kg para empezar un adulto principiante-intermedio,"nota":"una frase útil sobre el ajuste de la máquina o su pila de pesas"}`,{tier:"quick",max:800,blob:await shrink(f)}));
  const inc=+r.paso>0&&+r.paso<=20?+r.paso:undefined,w0=+r.peso_inicial>=0&&+r.peso_inicial<=300?+r.peso_inicial:undefined,note=String(r.nota||"").slice(0,160);
  let tid=id||(known.some(x=>x.id==r.id)?r.id:null),name;
  if(!tid){tid="c"+Date.now();name=String(r.nombre||"Ejercicio nuevo").slice(0,50);S.custom.push({id:tid,name,t:TYPES.includes(r.tipo)?r.tipo:"empuje",m:String(r.musculo||"otro").slice(0,30),w0:20,inc:5})}else name=byId(tid).name;
  const o={note};if(inc)o.inc=inc;if(w0!=null)o.w0=w0;S.info[tid]=o;save();msg="Analizada: "+name;
 }catch(e){msg="No he podido analizar la foto. Prueba otra vez."}
 render()}
function render(){
 const c=S.cur,v=tab=="time"?"time":c&&(tab=="home"||tab=="plan")?(c.phase=="train"?"train":"plan"):tab;
 document.getElementById("app").innerHTML=({home,time,plan:planV,train,hist,maq,set:ajustes,chat:chatV,cls:clsV})[v]();
 document.getElementById("nav").style.display=["train","time","plan","chat","cls"].includes(v)?"none":"flex";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{go(b.dataset.t);if(b.dataset.t=="chat"&&SR)micTog()});
setInterval(tickBar,500);render();if(S.cur&&S.cur.phase=="train")prefetch();
</script></body></html>
